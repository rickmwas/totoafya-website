<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Circular container with brand's forest green -->
  <circle cx="32" cy="32" r="30" fill="#1A6B45" />
  
  <!-- Stylized Mother (outer heart/head curve) in cream/white -->
  <path d="M32 46C32 46 19 37.5 19 26C19 20 23.5 15.5 29 15.5C31.5 15.5 33.5 17 34.5 18.5" 
        stroke="#FDFBF5" 
        stroke-width="3" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
  
  <!-- Inner head circle of the mother -->
  <circle cx="29" cy="23" r="3" fill="#FDFBF5" />
  
  <!-- Stylized Baby (inner curve/head) in warm amber -->
  <path d="M32 46C32 46 41 38 41 29.5C41 25.5 38 22.5 34.5 22.5C33 22.5 32 23 31.5 23.5" 
        stroke="#F9B820" 
        stroke-width="3.2" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
        
  <!-- Inner head circle of the baby -->
  <circle cx="34.5" cy="27.5" r="2.2" fill="#F9B820" />
  
  <!-- Delicate green pulse/leaf line highlight -->
  <path d="M25 41C27 41.5 28.5 40 29 39" 
        stroke="#A3D9BC" 
        stroke-width="2" 
        stroke-linecap="round" />
</svg>
